[package]
authors.workspace      = true
categories             = ["no-std"]
description            = "Web Client library that facilitates interaction with the Miden network"
documentation          = "https://docs.rs/miden-client-web"
edition.workspace      = true
keywords               = ["client", "miden", "wasm", "web"]
license.workspace      = true
name                   = "miden-client-web"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[package.metadata.cargo-machete]
ignored = ["miden-precompiles-prover", "wasm-bindgen-futures", "web-sys"]

[lib]
crate-type = ["cdylib"]

[features]
browser = [
  "dep:console_error_panic_hook",
  "dep:idxdb-store",
  "dep:js-sys",
  "dep:serde-wasm-bindgen",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:tracing-wasm",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "miden-client/tonic",
]
default = ["browser"]
nodejs = [
  "dep:miden-client-sqlite-store",
  "dep:napi",
  "dep:napi-build",
  "dep:napi-derive",
  "dep:tokio",
  "miden-client/std",
  "miden-client/tonic",
]
testing = ["miden-client/testing"]
# Multi-threaded WASM build. When enabled, pulls in wasm-bindgen-rayon (the
# rayon thread pool over Web Workers + SharedArrayBuffer) and propagates
# `concurrent` through the full miden-client dependency tree:
# miden-client/concurrent → miden-tx/concurrent → miden-prover/concurrent,
# with miden-crypto/concurrent picked up transitively from miden-prover —
# parallel prove and parallel Merkle/hash both active. Verify with:
# `cargo tree -p miden-client-web --features mt-threads --target wasm32-unknown-unknown -f "{p} {f}"`
# — miden-tx, miden-prover, and miden-crypto should all show
# `concurrent` in their feature lists.
#
# When DISABLED, the SDK is single-threaded end-to-end and works in
# non-cross-origin-isolated contexts (no SAB requirement, no `+atomics`
# target feature, stable cargo with the precompiled rust-std-wasm32 — no
# `-Z build-std` needed).
#
# Two distinct WASM artifacts are shipped (see crates/web-client/rollup.config.js):
#   - dist/{eager,lazy}-st  built without this feature  → loads anywhere
#   - dist/{eager,lazy}-mt  built with this feature     → requires COI
#
# Consumers select via package.json exports subpaths:
#   `@miden-sdk/miden-sdk`           → eager-st (default; safe everywhere)
#   `@miden-sdk/miden-sdk/lazy`      → lazy-st
#   `@miden-sdk/miden-sdk/mt`        → eager-mt (opt-in; needs COI)
#   `@miden-sdk/miden-sdk/mt/lazy`   → lazy-mt
mt-threads = ["dep:rayon", "dep:wasm-bindgen-rayon", "miden-client/concurrent"]

[dependencies]
# Workspace dependencies
miden-client = { features = ["testing"], workspace = true }

# Feature-only dependency: nothing in this crate uses it directly. Enabling its
# `std` feature makes `miden-precompiles-prover` cache the preprocessed STARK
# bundle (2^16-row BytePairLut table + coset LDE + Merkle commitment) in a
# process-lifetime `OnceLock`; without `std` every prove/verify that raises a
# precompile claim (e.g. an ECDSA-authenticated transaction) rebuilds it from
# scratch. The MT build already gets `std` transitively via
# `miden-client/concurrent`; this makes the ST build match.
#
# The trade is memory: ~50 MiB retained per proving hash function (2 MiB table
# + 16 MiB LDE at log_blowup 3 + ~32 MiB of Merkle digest layers), held until
# the WASM instance is torn down — the cache is a function-local `OnceLock`, so
# there is no eviction API. There is one slot per hash function, but only two
# are reachable: the zero-config path (`submitNewTransaction` proves with
# `None`) falls through to miden-client's default
# `LocalTransactionProver::default()`, which is `ProvingOptions::new(Poseidon2)`,
# while `TransactionProver.newLocalProver()` uses `ProvingOptions::default()`,
# which is Blake3_256. An app that does both retains ~100 MiB.
#
# Deliberately NOT `miden-prover/std`: its `std` pulls `miden-processor/std` AND
# un-gates the call site in miden-prover that reaches miden-processor's
# std-gated threaded trace build, which traps on wasm32 (std::thread::scope).
# (The MT build does carry both — it has enough of a runtime for them.)
#
# Cargo unifies features per target, so this flips `std` for more than the one
# crate. Verify the full blast radius with:
# `cargo tree -p miden-client-web --target wasm32-unknown-unknown -e normal -f "{p} {f}"`
# — today it also moves miden-air, miden-core, miden-debug-types,
# miden-formatting, miden-precompiles, miden-utils-indexing, miden-utils-sync,
# ruint, and serde_spanned to `std`. The one with teeth is miden-utils-sync:
# under `std` its `RwLock` becomes `parking_lot::RwLock` (from a hand-rolled
# spinlock) and `LazyLock` becomes `std::sync::LazyLock`, which links
# parking_lot into the ST build. parking_lot_core has no `nightly` feature
# here, so on wasm32 it selects the parker that panics on any blocking
# acquisition. That is reachable only by blocking, and the ST build has one
# thread — so only a re-entrant acquisition could trip it, which would have
# hung the old spinlock just as surely. parking_lot's eventual-fairness timer,
# the other wasm32 hazard, is inert: parking_lot_core compiles its
# `TimeoutInstant` down to a ZST on this target precisely because `Instant`
# panics here. The MT build has shipped this same configuration all along.
# None of the newly-`std` crates reach a thread, filesystem, or `std::time`
# path from the web client.
#
# See issue #318.
miden-precompiles-prover = { features = ["std"], workspace = true }

# Proc macro for dual wasm_bindgen/napi annotations. The workspace dependency carries both a path
# and version so the published manifest remains valid.
js-export-macro = { workspace = true }

# Optional MT-only deps: pulled in by the `mt-threads` feature.
# wasm-bindgen-rayon bootstraps a rayon thread pool over Web Workers backed
# by SharedArrayBuffer; rayon is used directly by diagnostic helpers
# (`rayon_thread_count`, `parallel_sum_bench`) which are additionally gated
# behind `feature = "testing"` so they don't leak into production WASM
# bundles. See lib.rs for the cfg gates.
rayon              = { optional = true, version = "1.10" }
wasm-bindgen-rayon = { optional = true, version = "1.3" }

# Common external dependencies
async-trait         = { workspace = true }
hex                 = { version = "0.4" }
rand                = { workspace = true }
serde               = { features = ["derive"], workspace = true }
thiserror.workspace = true

# Browser-only dependencies (wasm_bindgen)
console_error_panic_hook = { optional = true, version = "0.1.7" }
idxdb-store              = { optional = true, workspace = true }
js-sys                   = { optional = true, version = "0.3" }
serde-wasm-bindgen       = { optional = true, version = "0.6" }
tracing                  = { optional = true, workspace = true }
tracing-subscriber       = { default-features = false, features = ["registry"], optional = true, version = "0.3" }
tracing-wasm             = { optional = true, version = "0.2" }
wasm-bindgen             = { features = ["serde-serialize"], optional = true, version = "=0.2.108" }
wasm-bindgen-futures     = { optional = true, version = "0.4" }

# Node.js-only dependencies (napi-rs)
miden-client-sqlite-store = { optional = true, workspace = true }
napi                      = { features = ["tokio_rt"], optional = true, workspace = true }
napi-derive               = { optional = true, workspace = true }
tokio                     = { optional = true, workspace = true }

# web-sys is a browser-only dependency used for console logging
web-sys = { features = ["console"], optional = true, version = "0.3" }

[build-dependencies]
napi-build = { optional = true, workspace = true }

[lints]
workspace = true
