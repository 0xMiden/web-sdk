[package]
authors.workspace      = true
categories             = ["no-std"]
description            = "Web Client library that facilitates interaction with the Miden network"
documentation          = "https://docs.rs/miden-client-web"
edition.workspace      = true
keywords               = ["client", "miden", "wasm", "web"]
license.workspace      = true
name                   = "miden-client-web"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen-futures", "web-sys"]

[lib]
crate-type = ["cdylib"]

[features]
browser = [
  "dep:console_error_panic_hook",
  "dep:idxdb-store",
  "dep:js-sys",
  "dep:serde-wasm-bindgen",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:tracing-wasm",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "miden-client/tonic",
]
default = ["browser"]
nodejs = [
  "dep:miden-client-sqlite-store",
  "dep:napi",
  "dep:napi-build",
  "dep:napi-derive",
  "dep:tokio",
  "miden-client/std",
  "miden-client/tonic",
]
testing = ["miden-client/testing"]
# Multi-threaded WASM build. When enabled, pulls in wasm-bindgen-rayon (the
# rayon thread pool over Web Workers + SharedArrayBuffer) and propagates
# `concurrent` through the full miden-client dependency tree:
# miden-client/concurrent → miden-tx/concurrent → miden-prover/concurrent,
# with miden-crypto/concurrent picked up transitively from miden-prover —
# parallel prove and parallel Merkle/hash both active. Verify with:
# `cargo tree -p miden-client-web --features mt-threads --target wasm32-unknown-unknown -f "{p} {f}"`
# — miden-tx, miden-prover, and miden-crypto should all show
# `concurrent` in their feature lists.
#
# When DISABLED, the SDK is single-threaded end-to-end and works in
# non-cross-origin-isolated contexts (no SAB requirement, no `+atomics`
# target feature, stable cargo with the precompiled rust-std-wasm32 — no
# `-Z build-std` needed).
#
# Two distinct WASM artifacts are shipped (see crates/web-client/rollup.config.js):
#   - dist/{eager,lazy}-st  built without this feature  → loads anywhere
#   - dist/{eager,lazy}-mt  built with this feature     → requires COI
#
# Consumers select via package.json exports subpaths:
#   `@miden-sdk/miden-sdk`           → eager-st (default; safe everywhere)
#   `@miden-sdk/miden-sdk/lazy`      → lazy-st
#   `@miden-sdk/miden-sdk/mt`        → eager-mt (opt-in; needs COI)
#   `@miden-sdk/miden-sdk/mt/lazy`   → lazy-mt
mt-threads = ["dep:rayon", "dep:wasm-bindgen-rayon", "miden-client/concurrent"]

[dependencies]
# Workspace dependencies
miden-client = { features = ["testing"], workspace = true }

# Proc macro for dual wasm_bindgen/napi annotations
js-export-macro = { path = "../js-export-macro" }

# Optional MT-only deps: pulled in by the `mt-threads` feature.
# wasm-bindgen-rayon bootstraps a rayon thread pool over Web Workers backed
# by SharedArrayBuffer; rayon is used directly by diagnostic helpers
# (`rayon_thread_count`, `parallel_sum_bench`) which are additionally gated
# behind `feature = "testing"` so they don't leak into production WASM
# bundles. See lib.rs for the cfg gates.
rayon              = { optional = true, version = "1.10" }
wasm-bindgen-rayon = { optional = true, version = "1.3" }

# Common external dependencies
async-trait         = { workspace = true }
hex                 = { version = "0.4" }
rand                = { workspace = true }
serde               = { features = ["derive"], workspace = true }
thiserror.workspace = true

# Browser-only dependencies (wasm_bindgen)
console_error_panic_hook = { optional = true, version = "0.1.7" }
idxdb-store              = { optional = true, workspace = true }
js-sys                   = { optional = true, version = "0.3" }
serde-wasm-bindgen       = { optional = true, version = "0.6" }
tracing                  = { optional = true, workspace = true }
tracing-subscriber       = { default-features = false, features = ["registry"], optional = true, version = "0.3" }
tracing-wasm             = { optional = true, version = "0.2" }
wasm-bindgen             = { features = ["serde-serialize"], optional = true, version = "=0.2.108" }
wasm-bindgen-futures     = { optional = true, version = "0.4" }

# Node.js-only dependencies (napi-rs)
miden-client-sqlite-store = { optional = true, workspace = true }
napi                      = { features = ["tokio_rt"], optional = true, workspace = true }
napi-derive               = { optional = true, workspace = true }
tokio                     = { optional = true, workspace = true }

# web-sys is a browser-only dependency used for console logging
web-sys = { features = ["console"], optional = true, version = "0.3" }

[build-dependencies]
napi-build = { optional = true, workspace = true }

[lints]
workspace = true
