# Trusted half of the proving-benchmark bot.
#
# A `workflow_run` workflow always executes the copy of this file on the
# DEFAULT branch, in the default branch's context, with a read/write
# GITHUB_TOKEN. A fork cannot influence it, because a fork's edits to
# .github/workflows/* live only on the PR head — which this workflow never
# reads. That is the whole point: `bench.yml` runs untrusted code with no
# credentials and produces data; this job holds credentials and runs only
# first-party code.
#
# Consequences worth remembering:
#   - This workflow CANNOT be tested from the PR that introduces it. It only
#     fires once it is on the default branch. Use the workflow_dispatch input
#     below to smoke-test it against a completed bench run.
#   - Its runs do not appear in the PR's Checks tab (they are attributed to the
#     default branch). The sticky comment and the check run created here are
#     the only PR-visible surfaces.
#
# !! `workflows:` below matches bench.yml by its `name:` field, not by
# !! filename. Renaming that workflow silently disables this one.
name: Proving Benchmark Comment

on:
  workflow_run:
    workflows: ["Proving Benchmark"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Bench run id to re-render (smoke test)"
        required: true
        type: string

permissions:
  # Required to download an artifact belonging to a different workflow run.
  actions: read
  contents: read
  pull-requests: write
  checks: write

concurrency:
  # Two quick pushes produce two reporters racing to update the same comment.
  # Keyed on the head repo + branch rather than the workflow name so unrelated
  # PRs never cancel each other.
  group: >-
    bench-comment-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post benchmark comparison
    # The bench workflow also runs on non-PR events in future; only act on PRs.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Deliberately a bare checkout: this resolves to the DEFAULT branch, the
      # same first-party code this workflow already runs from. We never check
      # out PR code here, and actions/checkout would refuse it anyway under
      # workflow_run.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve bench run id
        id: run
        shell: bash
        env:
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="${DISPATCH_RUN_ID:-$EVENT_RUN_ID}"
          # Digits only, and bounded. The dispatch input is a free-form string:
          # unvalidated, a newline in it injects further step outputs through
          # $GITHUB_OUTPUT, and the value goes on to be interpolated into a URL
          # and an API call. `[[ =~ ]]` rather than grep because grep matches
          # per line and would accept a multi-line value.
          if [[ ! "$run_id" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error title=Proving Benchmark::Not a run id."
            exit 1
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      # `actions/download-artifact` is deliberately NOT used here. It bundles an
      # unzip-stream whose path guard strips only a LEADING `../`, so an entry
      # named `x/../../y` escapes the extraction directory wherever that
      # directory is — including onto $GITHUB_EVENT_PATH and onto the staged
      # code under work/_actions that the steps below execute with a write
      # token. See the header of extract-bench-artifact.sh for the full account.
      #
      # Fetching the zip ourselves also lets the artifact be REFUSED BY SIZE
      # before a byte of it is written to disk, which downloading it cannot.
      - name: Fetch the benchmark artifact
        id: fetch
        uses: actions/github-script@v7
        env:
          BENCH_RUN_ID: ${{ steps.run.outputs.id }}
          ZIP_PATH: ${{ runner.temp }}/bench-report.zip
          # Compressed. The real artifact is tens of KB; this is generous
          # headroom that still refuses a zip bomb before it lands.
          MAX_ZIP_BYTES: 2097152
        with:
          script: |
            const fs = require('fs');

            const run_id = Number(process.env.BENCH_RUN_ID);
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id,
              per_page: 100,
            });
            const artifact = data.artifacts.find(
              (a) => a.name === 'proving-bench-report',
            );
            if (!artifact) {
              core.notice(`Run ${run_id} has no proving-bench-report artifact; nothing to post.`);
              return;
            }
            if (artifact.expired) {
              core.notice(`The artifact on run ${run_id} has expired; nothing to post.`);
              return;
            }
            const max = Number(process.env.MAX_ZIP_BYTES);
            if (artifact.size_in_bytes > max) {
              core.notice(`The artifact on run ${run_id} is ${artifact.size_in_bytes} compressed bytes (limit ${max}); nothing to post.`);
              return;
            }

            const zip = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync(process.env.ZIP_PATH, Buffer.from(zip.data));
            core.setOutput('fetched', 'true');

      # A missing artifact means the bench job failed or was cancelled. So does
      # an artifact with no results.json: bench.yml uploads unconditionally, so
      # a job that died before `Run benchmark` still produces one carrying only
      # pr.json and ctx.json. Neither is a reason to turn an informational bot
      # red — say nothing and stop.
      #
      # A HOSTILE archive is not a reason either. Confinement is structural here
      # (`unzip -j` discards every entry name's directory components, and only
      # the two expected basenames are extracted at all), so there is no
      # traversal left to detect and nothing to go red about. The previous two
      # versions of this step tried to detect one instead, and both were
      # defeated: the escaped file is by definition not in the directory being
      # inspected.
      - name: Extract the report
        id: report
        if: steps.fetch.outputs.fetched == 'true'
        shell: bash
        env:
          ZIP_PATH: ${{ runner.temp }}/bench-report.zip
          REPORT_DIR: ${{ runner.temp }}/bench-report
        run: |
          set -euo pipefail
          if [ "$(.github/scripts/extract-bench-artifact.sh "$ZIP_PATH" "$REPORT_DIR")" = "usable" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no report
        if: steps.report.outputs.usable != 'true'
        shell: bash
        env:
          # Through env, never interpolated into the script body.
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          echo "::notice title=Proving Benchmark::No usable report on run ${RUN_ID}; nothing to post."

      # Everything in the artifact was written by code the PR author controls.
      # The claimed PR number is cross-checked against fields only GitHub
      # populates (workflow_run.head_sha, head_repository.full_name); without
      # that check a fork could forge a number and post under this bot's token
      # onto somebody else's PR.
      #
      # workflow_run.pull_requests is EMPTY for fork PRs, so it is never read.
      - name: Verify PR identity
        id: pr
        if: steps.report.outputs.usable == 'true'
        uses: actions/github-script@v7
        env:
          BENCH_RUN_ID: ${{ steps.run.outputs.id }}
          REPORT_DIR: ${{ runner.temp }}/bench-report
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Nothing below calls core.setFailed. Every rejection here is either
            // a fork feeding the bot garbage or an ordinary push landing between
            // the bench run and this one — bench.yml cancels in progress, so the
            // race is the common case, not the exception. An informational bot
            // that goes red on a race is a bot people mute. core.error still
            // annotates the run, so a real forgery attempt is visible in the log
            // without failing a default-branch workflow.
            const refuse = (message) => {
              core.error(`Proving Benchmark: ${message}`);
            };

            let claimed;
            try {
              claimed = JSON.parse(
                fs.readFileSync(path.join(process.env.REPORT_DIR, 'pr.json'), 'utf8'),
              );
            } catch (error) {
              refuse(`pr.json missing or malformed: ${error.message}`);
              return;
            }

            const number = Number(claimed.number);
            if (!Number.isInteger(number) || number <= 0 || number > 1e7) {
              refuse(`Invalid PR number: ${JSON.stringify(claimed.number)}`);
              return;
            }

            // The triggering run is in the payload on the workflow_run path. On
            // workflow_dispatch it is not, but it is still fetchable by id —
            // fetch it, so both paths get the same cross-check. Skipping the
            // check on dispatch let anyone who can dispatch this workflow point
            // it at any run and post that artifact's chosen PR number.
            let run = context.payload.workflow_run;
            if (!run) {
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.BENCH_RUN_ID),
              });
              run = data;
            }
            if (run.name !== 'Proving Benchmark') {
              refuse(`Run ${run.id} is "${run.name}", not a Proving Benchmark run.`);
              return;
            }

            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              }));
            } catch (error) {
              // A number that does not resolve is a forged or stale artifact,
              // not an outage worth failing the workflow over.
              refuse(`PR #${number} could not be read: ${error.message}`);
              return;
            }

            // Tie the artifact to the run that produced it, using only fields
            // GitHub populates. Without this a fork could forge a number and
            // post under this bot's token onto somebody else's PR.
            //
            // The residual is narrow and self-inflicted: one fork branch can back
            // two open PRs (different bases), which share a head sha and head
            // repo, so an artifact from one can be reported on the other. Both
            // belong to the same author, so there is nothing to gain.
            if (pr.head.sha !== run.head_sha) {
              refuse(`PR #${number} head ${pr.head.sha} != run head ${run.head_sha}`);
              return;
            }
            if (pr.head.repo?.full_name !== run.head_repository?.full_name) {
              refuse('PR head repo does not match the triggering run');
              return;
            }

            if (pr.state !== 'open') {
              core.notice(`PR #${number} is ${pr.state}; skipping comment.`);
              return;
            }

            core.setOutput('number', String(number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);

      # Rendered HERE, in trusted code, from structured JSON. The untrusted job
      # never supplies markdown: benchmark names are fork-controlled, and
      # rendering fork-authored markdown under a write token would allow
      # mention storms, hidden HTML, and fake authority ("security review
      # passed"). The renderer sanitizes every interpolated string.
      - name: Render comment body
        id: render
        if: steps.pr.outputs.number
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          RUN_ID: ${{ steps.run.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}
          REPORT_DIR: ${{ runner.temp }}/bench-report
          # Written to scratch space, not the workspace: the checkout stays
          # exactly as actions/checkout left it, which is what makes the
          # tree-modified check above meaningful.
          BODY_PATH: ${{ runner.temp }}/body.md
        run: |
          set -euo pipefail
          # The rendering context is rebuilt from values GitHub gave THIS job,
          # not read from the artifact — the artifact only supplies measurements.
          # baseSha is the one field with no trusted source here (it is the
          # merge-base the bench actually measured), so it is taken from the
          # artifact and checked to be a lowercase hex sha before use.
          #
          # `[[ =~ ]]` and not `grep`: grep matches per LINE and so would accept
          # a multi-line value whose first line happens to look like a sha.
          base_sha=$(jq -r '.baseSha // ""' "$REPORT_DIR/pr.json" || true)
          if [[ ! "$base_sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::notice title=Proving Benchmark::Artifact baseSha is not a commit sha; nothing to post."
            exit 0
          fi
          # calibration is false by definition here: this job only ever posts on
          # a pull_request-triggered bench run, and a calibration run has no PR.
          jq -n \
            --arg owner "$OWNER" \
            --arg repo "$REPO_NAME" \
            --arg headSha "$HEAD_SHA" \
            --arg baseSha "$base_sha" \
            --arg baseRef "$BASE_REF" \
            --arg runId "$RUN_ID" \
            --arg runUrl "$RUN_URL" \
            '{owner: $owner, repo: $repo, headSha: $headSha, baseSha: $baseSha, baseRef: $baseRef, runId: $runId, runUrl: $runUrl, calibration: false}' \
            > "$RUNNER_TEMP/ctx.json"
          # A results.json the renderer rejects is a fork feeding the bot
          # garbage. Report nothing rather than turning a default-branch
          # workflow red over a payload the PR author chose.
          if ! node .github/scripts/render-bench-comment.mjs \
            "$REPORT_DIR/results.json" \
            "$RUNNER_TEMP/ctx.json" \
            > "$BODY_PATH"; then
            echo "::notice title=Proving Benchmark::Report could not be rendered; nothing to post."
            exit 0
          fi
          echo "Rendered $(wc -c < "$BODY_PATH") bytes"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # `continue-on-error`: the PR was open when `Verify PR identity` sampled
      # it, and the bench job it reports on ran for up to 90 minutes. In that
      # window the PR can be locked or closed, which makes createComment 403.
      # Every rejection upstream of here was made non-fatal on purpose; losing
      # that at the last step would put the informational bot back in the
      # business of turning the default branch red.
      - name: Post sticky comment
        if: steps.render.outputs.ok == 'true'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728 # v2.9.4
        with:
          # Distinct from the `linked-client-pr` header used by
          # inject-linked-client-pr, so the two bots never clobber each other.
          header: proving-benchmark
          number: ${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/body.md
          # A bot that posts when nothing moved trains people to ignore it.
          skip_unchanged: true

      # `neutral` never blocks merge, which is the stated requirement. It also
      # keeps the result out of the conversation timeline for people who would
      # rather read it in the Checks tab.
      - name: Publish neutral check run
        if: steps.render.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}
          BODY_PATH: ${{ runner.temp }}/body.md
        with:
          script: |
            const fs = require('fs');
            // check-run output.summary is capped at 65535 chars; the renderer
            // caps the comment body at 60000, so it always fits. No slicing
            // here — a second, unannounced truncation would be the only place
            // in this pipeline that drops content silently.
            const summary = fs.readFileSync(process.env.BODY_PATH, 'utf8');
            const head_sha = process.env.HEAD_SHA;
            const name = 'Proving Benchmark';
            const body = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              head_sha,
              status: 'completed',
              conclusion: 'neutral',
              details_url: process.env.RUN_URL,
              output: { title: 'Proving benchmark (informational)', summary },
            };

            // Update in place rather than stacking a second check run on the
            // same commit. Re-rendering happens routinely — a dispatch smoke
            // test, or a bench re-run for one head — and the Checks tab shows
            // every created run, so `create` alone reads as N conflicting
            // benchmark results for one commit.
            //
            // Read-modify-write, and not atomic: the concurrency group above
            // serializes the workflow_run path, but a manual dispatch keys
            // differently and can race it. The worst outcome is the duplicate
            // check run this is trying to avoid, which is why it is not worth a
            // lock.
            //
            // The whole block is best-effort. A head commit can be GC'd out from
            // under us — the fork branch is deleted while the bench is still
            // running — and `checks.create` then 422s on a sha that no longer
            // resolves. The comment is the surface that matters; failing the
            // reporter over the secondary one is not a trade worth making.
            try {
              const { data: existing } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: head_sha,
                check_name: name,
                per_page: 100,
              });
              const mine = existing.check_runs.find(
                (run) => run.app?.slug === 'github-actions',
              );
              if (mine) {
                // Explicit payload: PATCH check-runs does not take `head_sha`,
                // and spreading the create body would send it.
                await github.rest.checks.update({
                  owner: body.owner,
                  repo: body.repo,
                  check_run_id: mine.id,
                  name: body.name,
                  status: body.status,
                  conclusion: body.conclusion,
                  details_url: body.details_url,
                  output: body.output,
                });
              } else {
                await github.rest.checks.create(body);
              }
            } catch (error) {
              core.warning(`Could not publish the benchmark check run: ${error.message}`);
            }
