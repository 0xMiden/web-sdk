name: Build
on:
  push:
    branches: [main, next]
  pull_request:
  # Manual re-trigger. This workflow carries required status checks, and a
  # push does not reliably create its workflow runs: this repo has seen a
  # merge commit land on `main` with *no* push-triggered runs at all while
  # Actions was otherwise healthy (other branches got full sets in the same
  # window). Without a dispatch entry the only way to recover the gate on such
  # a commit is to push an empty one; with it, re-run the ref as it stands:
  #   gh workflow run build.yml --repo 0xMiden/web-sdk --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Pre-flight: detect whether any non-docs files changed. We deliberately
  # trigger this workflow on EVERY push/PR (no top-level paths-ignore) so
  # required status checks always report a state — `paths-ignore` at the
  # workflow level prevents the workflow from running at all on docs-only
  # PRs, which leaves required checks stuck in "Expected" forever and blocks
  # merging. Instead, every downstream job gates on this filter's output and
  # reports `skipped` when there's nothing relevant to build (skipped jobs
  # satisfy required checks).
  #
  # ---- Why the downstream `if:` conditions below look the way they do ----
  #
  # "A skipped job satisfies a required check" is what makes a docs-only PR
  # mergeable. Its corollary is dangerous: ANYTHING that makes a downstream job
  # skip turns this gate green without building a line of code.
  #
  # `needs: [changes]` + `if: needs.changes.outputs.non_docs == 'true'` had
  # exactly that hole. A job whose `if` contains no status-check function is
  # skipped whenever a `needs` dependency fails — so a `changes` job that died
  # on a checkout hiccup or a rate-limited/unavailable dorny/paths-filter took
  # the build jobs to `skipped`, i.e. to "passed". A transient preflight
  # failure silently converted the gate into a pass.
  #
  # The condition on each job below fails CLOSED instead: skip only on positive
  # evidence that this PR is docs-only; build in every other case.
  #
  #   !cancelled()
  #       A status-check function, which is what lifts the implicit
  #       skip-when-a-dependency-failed rule and lets the job run anyway. Not
  #       `always()`: `always()` would also run the job while the whole
  #       workflow is being cancelled, which fights cancellation and burns
  #       runner time. `!cancelled()` runs on failure but not on cancellation.
  #
  #   needs.changes.result != 'success'
  #       The preflight did not succeed, so there is no trustworthy verdict
  #       about what changed. Unknown means build. (This clause is what closes
  #       the hole; it is also why a `result != 'failure'` formulation would
  #       NOT work — that one still resolves to false, and false still means
  #       skipped, and skipped still means passed.)
  #
  #   needs.changes.outputs.non_docs != 'false'
  #       The preflight did not positively say "docs only". Deliberately
  #       `!= 'false'` and not `== 'true'`: an empty or unexpected output — a
  #       future paths-filter behaviour change, or a `changes` job that failed
  #       at a step after the filter ran — reads as unknown, and unknown
  #       builds. The two clauses are OR'd, so either kind of doubt is enough.
  #
  #   github.event_name == 'workflow_dispatch'
  #       A manual dispatch always builds, and the `changes` job below does not
  #       even run on one. This is not belt-and-braces; without it the dispatch
  #       entry at the top of this file was decorative.
  #
  #       dorny/paths-filter is given no `base` and no `ref`, so on anything
  #       that is not a pull_request it takes its git-diff path with
  #       `base` = repository.default_branch (its documented default) and
  #       `head` = github.ref. Dispatch the recovery case this workflow's
  #       workflow_dispatch exists for — `gh workflow run build.yml --ref main`
  #       — and base and head are both `main`. The action reads that as "the
  #       ref was pushed to itself" and looks for github.event.before to diff
  #       against; `before` exists only on push events, so on a dispatch it is
  #       absent, the action warns and falls back to "changes in the last
  #       commit". When that commit is a merge commit, `git log -1
  #       --name-status` reports no files at all, the filter sees an empty file
  #       set, `non_docs` resolves to 'false', and every job below skips —
  #       i.e. the manual run you fired *because the push-triggered run never
  #       appeared* reports all-green having built nothing. Skipping the
  #       preflight entirely on dispatch is the fix: there is nothing for it to
  #       usefully compare, and "someone asked for this run by hand" is already
  #       the answer to "should we build?".
  #
  # Walk-through of every case:
  #   normal code PR      changes=success, non_docs='true'  -> RUNS
  #   docs-only PR        changes=success, non_docs='false' -> SKIPPED (both
  #                       clauses false; the deliberate behaviour documented
  #                       above is preserved bit-for-bit)
  #   push to main/next   same as a PR: paths-filter diffs against
  #                       github.event.before (push to the default branch) or
  #                       against the default branch (push to `next`)
  #   preflight failed    changes=failure, non_docs=''      -> RUNS, and the
  #                       required check reports the real build result rather
  #                       than a free pass
  #   workflow_dispatch   changes=skipped, non_docs=''      -> RUNS (first
  #                       clause; the other two would also carry it, since
  #                       'skipped' != 'success' and '' != 'false')
  #   workflow cancelled  !cancelled() is false             -> SKIPPED
  changes:
    name: Detect relevant changes
    # Not on a manual dispatch: paths-filter has nothing meaningful to diff
    # there and answers "nothing changed" for a merge commit, which would skip
    # every job below. Skipped is fine for the required check, and the jobs
    # below run regardless — see the walk-through above.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `non_docs` matches whenever a changed file is NOT a doc/text file
          # under one of the listed paths. Mirror of the previous
          # `paths-ignore` set.
          filters: |
            non_docs:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'

  build-wasm:
    name: Build Client for Wasm
    needs: [changes]
    # Fails closed when the preflight itself fails, and always builds on a
    # manual dispatch — walk-through above.
    if: >-
      !cancelled()
      && (github.event_name == 'workflow_dispatch'
      || needs.changes.result != 'success'
      || needs.changes.outputs.non_docs != 'false')
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      # Required by .github/actions/inject-linked-client-pr's sticky
      # comment step. Scoped to this job (the only one that posts) so
      # the rest of the workflow keeps the read-only default.
      pull-requests: write
    env:
      # See test.yml's build-web-client-dist-folder for rationale.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      # Auto-patch miden-client dep against any "Client PR: #N" marker in
      # the PR description. This is the *one* job per workflow run that
      # opts into posting the sticky PR comment about the patch — every
      # other cargo-using job re-runs the action with comment=false (the
      # default) so we keep the strict 0-or-1 comment invariant.
      - name: Inject linked miden-client PR
        uses: ./.github/actions/inject-linked-client-pr
        with:
          comment: "true"
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust toolchain
        run: rustup update --no-self-update
      - name: Add wasm32-unknown-unknown target
        run: |
          rustup target add wasm32-unknown-unknown
          # Stable wasm32 std for the ST rollup path (RUSTUP_TOOLCHAIN=stable
          # is set inside crates/web-client/rollup.config.js for the ST build).
          rustup install stable --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain stable
      # `make build-wasm` invokes `pnpm --filter web_store run build` for
      # the idxdb-store TS bindings before the Rust WASM build runs. Need
      # pnpm + node + a populated workspace install in scope.
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      # See test.yml for rationale (GHA cache v1 -> v2 endpoint).
      - name: Configure sccache cache backend (v2)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
        id: sccache-install

      - name: Probe sccache and enable wrapper if healthy
        if: steps.sccache-install.outcome == 'success' && env.SCCACHE_PATH != ''
        shell: bash
        run: |
          probe_out=$("$SCCACHE_PATH" --start-server 2>&1) && rc=0 || rc=$?
          echo "$probe_out"
          if [ $rc -eq 0 ]; then
            echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
            echo "sccache enabled as RUSTC_WRAPPER ($SCCACHE_PATH)"
          else
            echo "sccache --start-server failed (rc=$rc); running without wrapper"
          fi
      - name: make - build-wasm
        run: make build-wasm
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  # The adopted packages (adapter/*, para/*, turnkey/*) are pnpm workspace
  # members that, until this job existed, nothing in CI ever compiled:
  # build-wasm above builds the Rust client, test.yml runs vitest, lint.yml runs
  # eslint, and check-publish.yml's publint/attw gates are filtered to exactly
  # three packages. The first `tsc` over an adopted package therefore ran inside
  # publish-web-sdk.yml at *release* time — on a tag, after sibling packages had
  # already been pushed to npm. v0.16.0-rc.5 lost 5 of 11 packages that way, to
  # type errors that had been sitting on `next` for days.
  #
  # This job is that missing compile, moved to where it is cheap to fix. It runs
  # the same `pnpm --filter <pkg> run build` the release runs, driven by the same
  # scripts/publish-manifest.json, in the same topological `level` order — so a
  # green run here is evidence about the release, not a proxy for it.
  #
  # It lives in Build (not check-publish.yml) because every rc.5 failure was a
  # *build* failure. check-publish.yml is gated behind a full Rust/WASM build on
  # a warp 8x runner and carries a workflow-level `paths-ignore`, which is the
  # very pattern the `changes` preflight above exists to avoid; putting a
  # 90-second typecheck behind a multi-minute WASM build inverts the feedback
  # ratio for a contributor whose PR only touches TypeScript.
  build-adopted-packages:
    name: Build adopted packages
    needs: [changes]
    # Fails closed when the preflight itself fails, and always builds on a
    # manual dispatch — walk-through above.
    if: >-
      !cancelled()
      && (github.event_name == 'workflow_dispatch'
      || needs.changes.result != 'success'
      || needs.changes.outputs.non_docs != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # No Rust here on purpose. The adopted packages need `@miden-sdk/miden-sdk`
      # only for its *types*, which resolve to crates/web-client/dist — so we
      # populate that dist from the published npm tarball (seconds) instead of
      # building the WASM client (minutes, plus nightly + stable wasm32 targets
      # and binaryen). Caveat, and it is why hydrate shouts in the log: when
      # crates/web-client/package.json names an unpublished version (a release PR
      # mid-bump, or an unreleased rc on `next`), hydrate falls back to the newest
      # published client. An adopted package that consumes a brand-new, unreleased
      # client API would then fail here for a reason that is not its own fault —
      # read the hydrate warning before chasing such a failure.
      - name: Hydrate web-client dist from npm
        run: pnpm run hydrate:web-client

      # `@miden-sdk/react` is a workspace dep of the adapter/para/turnkey React
      # packages and its `types` field points at dist/index.d.ts, so its dist has
      # to exist before they can typecheck against it. This is the same ordering
      # the release relies on — react-sdk is published before the adopted
      # packages — made explicit.
      - name: Build @miden-sdk/react
        run: pnpm run build:react-sdk

      # Manifest-driven: scripts/publish-manifest.json is the only list. Adding a
      # package there with "build": true brings it under this job automatically.
      # The script validates the manifest against the real pnpm workspace first,
      # because `pnpm --filter` exits 0 both for a name that matches no package
      # and for a package with no `build` script — either would leave this job
      # green while building nothing.
      #
      # It then asserts each package actually emitted the files its package.json
      # `exports`/`main`/`types`/`bin` promise. `copyfiles` exits 0 when its glob
      # matches nothing, which is how packages/adapter/all shipped rc.5 with a
      # dead "./styles.css" export through a build where every command returned
      # 0 — an exit-code gate cannot see that, so we check the contract instead.
      - name: Build adopted packages (manifest level order)
        run: ./scripts/build-adopted-packages.sh

      # publint over the same manifest list. Until this step, the root
      # `check:publint` / `check:attw` scripts were filtered to exactly three
      # packages (@miden-sdk/miden-sdk, @miden-sdk/react, @miden-sdk/vite-plugin),
      # so eleven published packages had no package-shape gate at all — and two
      # of them shipped defects in v0.16.0-rc.5 that publint reports in under a
      # second.
      #
      # It lives here rather than in check-publish.yml for two reasons. First,
      # check-publish.yml carries a workflow-level `paths-ignore` — the exact
      # pattern the `changes` preflight at the top of this file exists to avoid,
      # because a required check that never runs on a docs-only PR sits in
      # "Expected" forever and blocks the merge. Second, check-publish.yml gates
      # everything behind a full Rust/WASM build on a warp 8x runner, and these
      # packages need no Rust at all — they need their own dist/, which the step
      # above just produced. Linting a package.json here reuses that build
      # instead of paying for a WASM toolchain to do it.
      - name: publint (adopted packages)
        run: pnpm run check:publint:adopted

      # attw (arethetypeswrong) is REPORT-ONLY, deliberately and temporarily. It
      # is red today for 5 of the 9 adopted packages that publish types, and
      # every remaining failure is a package-shape defect that has to be fixed
      # in the package itself:
      #   - @miden-sdk/para, @miden-sdk/turnkey, @miden-sdk/turnkey-react:
      #     FalseCJS — the "import" condition resolves to an ESM JavaScript file
      #     but a CommonJS type declaration.
      #   - @miden-sdk/miden-wallet-adapter-react: CJSResolvesToESM (`require`
      #     resolves to an ESM file) plus InternalResolutionError (its .d.ts
      #     imports something the emitted JavaScript does not resolve to).
      #   - @miden-sdk/para-react: NoResolution on the "./vite" subpath under
      #     node10.
      # @miden-sdk/miden-wallet-adapter is green: packages/adapter/all/.attw.json
      # declares "profile": "esm-only" and excludes the styles.css entry point,
      # which was attw resolving a stylesheet as a module. That is a config
      # answer to a config-shaped complaint; the five above are not.
      # Landing it red on day one would only teach everyone to ignore it. The
      # signal is worth having now; delete `continue-on-error` once that list is
      # empty. `pnpm run check:attw:adopted` reproduces it locally.
      #
      # The script skips packages that publish no type declarations at all (the
      # create-* scaffolders are bin-only), decided from their package.json — not
      # from a list — so attw is never asked a question it cannot answer.
      - name: attw (adopted packages, report-only)
        continue-on-error: true
        run: pnpm run check:attw:adopted
