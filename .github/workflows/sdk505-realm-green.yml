name: SDK 505 realm green proof
on:
  push:
    branches: [ci/sdk505-realm-green]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Check frozen source
        run: |
          git checkout --detach 53cd54fd22e1af9209c3ee74c2a4562b2b22799f
          test "$(git rev-parse HEAD)" = 53cd54fd22e1af9209c3ee74c2a4562b2b22799f
      - name: Run web client unit suite
        working-directory: crates/web-client
        run: pnpm exec vitest run
