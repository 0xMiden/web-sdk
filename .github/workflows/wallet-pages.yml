name: Deploy wallet example

on:
  workflow_dispatch:

  # The build half also runs on PRs that touch the example or a package it
  # imports. Without this the workflow only ever ran by hand, which is how the
  # example came to import two package names that do not exist. The paths
  # filter keeps it off every other PR, and the deploy job stays manual, so
  # this is a build check and not a release path. Don't add it to the required
  # checks: it installs from the registry and so depends on what is published.
  pull_request:
    paths:
      - ".github/workflows/wallet-pages.yml"
      - "packages/react-sdk/**"
      - "packages/adapter/react/**"
      - "packages/para/react/**"
      - "packages/turnkey/react/**"
      - "packages/vite-plugin/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The workspace (root) uses pnpm. The example app at
      # packages/react-sdk/examples/wallet is intentionally OUTSIDE the
      # workspace: it is an application, not a published package, so it
      # installs standalone against real published versions and keeps its own
      # pnpm-lock.yaml.
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build react sdk
        run: pnpm --filter @miden-sdk/react run build
      - name: Install wallet example dependencies (pnpm, ignore-workspace)
        # The example is intentionally OUTSIDE the workspace (not listed in
        # pnpm-workspace.yaml). --ignore-workspace tells pnpm to treat this
        # subdir as a standalone project, so it resolves the @miden-sdk/*
        # packages from the registry at the versions it pins rather than
        # linking the working tree.
        working-directory: packages/react-sdk/examples/wallet
        run: pnpm install --no-frozen-lockfile --ignore-workspace
      - name: Build wallet example
        working-directory: packages/react-sdk/examples/wallet
        run: pnpm exec vite build --base=/${{ github.event.repository.name }}/wallet-react-example/ --outDir=dist/wallet-react-example
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/react-sdk/examples/wallet/dist

  deploy:
    needs: build
    # Publishing stays manual. A PR run is only there to prove the example
    # still builds.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
