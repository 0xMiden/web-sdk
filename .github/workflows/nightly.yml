# Checks that run once per day.
name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Everyday at 06:00am UTC

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  # Check that our MSRV complies with our specified rust version.
  workspace-packages:
    name: List packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.package-matrix.outputs.packages }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - &update-ca-certificates
        name: Update CA certificates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          ubuntu_version="$(awk -F= '$1 == "VERSION_ID" {gsub(/"/, "", $2); print $2}' /etc/os-release)"
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge "20260816ubuntu0.${ubuntu_version}.1"
      - uses: actions/checkout@v6
        with:
          ref: "next"
      - name: Extract workspace packages
        id: package-matrix
        run: |
          # The MSRV check verifies each package against wasm32-unknown-unknown.
          # miden-mobile-prover is a native-only crate (cdylib/staticlib C ABI for
          # iOS/Android, published via the native release job) and is never built
          # for wasm. Verifying its MSRV against wasm is a category error: it drags
          # in the tonic->hyper->tokio->mio gRPC stack, and mio (which declares no
          # rust-version) fails to compile on our MSRV. Exclude it here.
          PACKAGES=$(cargo metadata --format-version 1 --no-deps \
            | jq -c '
              .workspace_members as $members
              | .packages
              | map(select(.id as $id | $members | index($id)))
              | map(.name)
              | map(select(. != "miden-mobile-prover"))
            ')

          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  msrv:
    needs: workspace-packages
    runs-on: ubuntu-24.04
    strategy:
      # Report every package's MSRV status instead of cancelling the rest the
      # moment one fails — otherwise a single failing leg masks whether the
      # others comply.
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.workspace-packages.outputs.packages) }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - *update-ca-certificates
      - uses: actions/checkout@v6
        with:
          ref: "next"
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-msrv
        run: cargo binstall --no-confirm cargo-msrv
      - name: Get manifest path for package
        id: pkg
        run: |
          MANIFEST_PATH=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '
              .packages[]
              | select(.name == "${{ matrix.package }}")
              | .manifest_path
            ')
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
      - name: Show package info
        run: |
          echo "Package: ${{ matrix.package }}"
          echo "Manifest path: ${{ steps.pkg.outputs.manifest_path }}"
          cargo msrv show --manifest-path "${{ steps.pkg.outputs.manifest_path }}"
      - name: Check MSRV
        run: |
          cargo msrv verify --manifest-path "${{ steps.pkg.outputs.manifest_path }}" --target wasm32-unknown-unknown
