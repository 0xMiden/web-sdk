name: Fresh Web SDK storage assertion proof

on:
  push:
    branches: [ci/fresh-web-storage-red]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise the frozen assertions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2b8779082ab2b8574b7b0b44532e3ea67cf1a3ff
          set +e
          pnpm -C crates/web-client exec vitest run js/__tests__/storage-continuity.test.js --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/web-storage.json"
          web=$?
          pnpm -C crates/idxdb-store/src exec vitest run ts/storage-continuity.test.ts ts/notes.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/idb-storage.json"
          idb=$?
          set -e
          test "$web" = 1 && test "$idb" = 1
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          function failed(file) {
            const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${file}`, 'utf8'));
            return result.testResults.flatMap(suite => suite.assertionResults)
              .filter(test => test.status === 'failed')
              .map(test => {
                console.log(test.fullName, test.failureMessages[0]);
                return test.fullName;
              });
          }
          const web = failed('web-storage.json');
          const idb = failed('idb-storage.json');
          for (const [results, title] of [
            [web, 'waits for method-worker note retention and forwards sanitized storage failures'],
            [web, 'uses the native commitment lookup without fetching the full note list'],
            [idb, 'requests strict durability at the IndexedDB write transaction'],
            [idb, 'pages raw input note rows by an exclusive metadata-independent key']
          ]) assert.ok(results.some(name => name.endsWith(title)), title);
          NODE
