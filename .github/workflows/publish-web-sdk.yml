# Single publish workflow for the entire web-sdk monorepo.
#
# Replaces the previous two-workflow setup (publish-web-client-release.yml
# + publish-web-client-next.yml) with one file. The motivation is npm's
# trusted-publishing constraint: trust is keyed on (package, repo) - only
# ONE workflow filename per package can be the trusted publisher. To use
# trusted publishing for both the GitHub-release flow AND the next-channel
# patch-release flow, both must come from the same workflow file.
#
# Auth model:
# - id-token: write at the workflow level → GitHub mints the OIDC token
#   that npm exchanges for a short-lived publish credential.
# - npm CLI 11.5+ auto-detects the OIDC environment and skips token-based
#   auth. We do NOT set NODE_AUTH_TOKEN.
# - --provenance is added to every npm publish for the signed attestation.
#
# Branching:
# - `release: published` → publishes to the `latest` dist-tag, gated by
#   the `check-*-version-release.sh` scripts.
# - `workflow_dispatch` → same `latest` path as a GitHub Release, but
#   checks out the dispatched ref (typically `main`) instead of a tag.
#   Use this to publish adopted packages whose versions are not on npm
#   yet without cutting a new web-client tag.
# - `pull_request: closed` (against next, with the `patch release` label)
#   → publishes to the `next` dist-tag, gated by `check-*-version-pr.sh`.
# - The vite-plugin ships on `latest` events (release and dispatch; no
#   -pr.sh script for it).

name: Publish Web SDK

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches:
      - next
    types:
      - closed

permissions:
  contents: read
  id-token: write

jobs:
  check-version:
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'patch release'))
    runs-on: ubuntu-24.04
    outputs:
      should_publish_web: ${{ steps.check_web.outputs.should_publish }}
      web_version: ${{ steps.check_web.outputs.current_version }}
      should_publish_react: ${{ steps.check_react.outputs.should_publish }}
      react_version: ${{ steps.check_react.outputs.current_version }}
      should_publish_vite: ${{ steps.check_vite.outputs.should_publish }}
      vite_version: ${{ steps.check_vite.outputs.current_version }}
      dist_tag: ${{ steps.event.outputs.dist_tag }}
      adopted_plan: ${{ steps.plan_adopted.outputs.plan }}
      adopted_count: ${{ steps.plan_adopted.outputs.count }}
      checkout_ref: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve event-specific config
        id: event
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # A pre-release must not take `latest`: it is the version every fresh
            # `npm install` resolves to, and an rc client is rejected outright by a
            # node on the stable line it does not match.
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            else
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            fi
            echo "checkout_ref=refs/tags/${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "version_check_arg=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "version_mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "version_check_arg=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "version_mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=next" >> "$GITHUB_OUTPUT"
            echo "version_check_arg=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "version_mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.event.outputs.checkout_ref }}

      # Resolve moving next/dispatch refs once, before planning or building.
      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check web-client version bump
        id: check_web
        run: |
          if [ "${{ steps.event.outputs.version_mode }}" = "release" ]; then
            ./scripts/check-web-client-version-release.sh "${{ steps.event.outputs.version_check_arg }}"
          else
            ./scripts/check-web-client-version-pr.sh "${{ steps.event.outputs.version_check_arg }}"
          fi

      - name: Check react-sdk version bump
        id: check_react
        run: |
          if [ "${{ steps.event.outputs.version_mode }}" = "release" ]; then
            ./scripts/check-react-sdk-version-release.sh "${{ steps.event.outputs.version_check_arg }}"
          else
            ./scripts/check-react-sdk-version-pr.sh "${{ steps.event.outputs.version_check_arg }}"
          fi

      - name: Check vite-plugin version bump (latest only)
        id: check_vite
        if: steps.event.outputs.version_mode == 'release'
        run: ./scripts/check-vite-plugin-version-release.sh "${{ steps.event.outputs.version_check_arg }}"

      # The packages adopted from the wallet-adapter / para / turnkey repos are
      # gated from scripts/publish-manifest.json rather than one bespoke script
      # each. Adding a package to that manifest is all a new package needs.
      - name: Build publish plan for adopted packages
        id: plan_adopted
        run: |
          if [ "${{ steps.event.outputs.version_mode }}" = "release" ]; then
            PLAN=$(./scripts/publish-plan.sh plan release "$GITHUB_SHA")
          else
            PLAN=$(./scripts/publish-plan.sh plan pr "${{ github.event.pull_request.base.sha }}")
          fi
          echo "plan<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PLAN" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$PLAN" | jq 'length')" >> "$GITHUB_OUTPUT"
          printf '%s' "$PLAN" | jq -r '.[] | "will publish \(.name)@\(.version) (level \(.level))"'

  build-native-nodejs:
    needs: check-version
    if: needs.check-version.outputs.should_publish_web == 'true'
    strategy:
      matrix:
        include:
          - os: macos-26
            platform-package: node-sdk-darwin-arm64
          - os: macos-26-intel
            platform-package: node-sdk-darwin-x64
          - os: ubuntu-24.04
            platform-package: node-sdk-linux-x64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.check-version.outputs.checkout_ref }}

      - name: Install Rust
        run: rustup update --no-self-update

      - name: Build napi binary
        run: |
          cargo build -p miden-client-web --no-default-features --features nodejs,testing --release --locked
          git diff --exit-code -- Cargo.lock

      - name: Prepare .node binary
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXT="dylib"
          else
            EXT="so"
          fi
          BINARY=$(find target -name "libmiden_client_web.${EXT}" -path "*/release/*" | head -1)
          if [ -z "$BINARY" ]; then
            echo "::error::napi binary not found"
            exit 1
          fi
          cp "$BINARY" "packages/${{ matrix.platform-package }}/miden_client_web.node"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform-package }}
          path: packages/${{ matrix.platform-package }}/miden_client_web.node

  # The musl (Alpine) binary is built by its own job, outside the matrix above,
  # because it cross-compiles in a container. It is required like the other
  # three: `publish` runs the web-client path only when this job succeeded, so
  # a release ships all four native packages or none.
  build-native-nodejs-musl:
    needs: check-version
    if: needs.check-version.outputs.should_publish_web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.check-version.outputs.checkout_ref }}

      - name: Build napi binary (musl cross via rust-musl-cross)
        # A dynamically linked musl cdylib so a musl-linked Node (Alpine) can
        # dlopen it against its own libc instead of a second, statically
        # embedded copy (-crt-static is disabled; a static CRT inside a shared
        # object breaks dlopen).
        #
        # Build inside messense/rust-musl-cross, which ships a real
        # musl-targeting GNU toolchain (with a musl libgcc). A plain cross-build
        # with musl-tools' musl-gcc does not work here. musl-gcc only wraps the
        # host glibc gcc and does not set rustc's linker, so rustc falls back to
        # the host linker driver and silently produces a glibc-linked .so
        # (NEEDED libc.so.6 / ld-linux-x86-64.so.2) that cannot load on Alpine.
        # The rust-musl-cross toolchain links a genuine musl binary; the Alpine
        # smoke test below is the backstop.
        #
        # The image is pinned by digest (not the mutable :x86_64-musl tag): this
        # step runs in the provenance-signed publish pipeline, so the third-party
        # toolchain that produces the shipped binary must be immutable. Bump the
        # digest deliberately after re-verifying a new image. The pinned nightly is
        # installed by name from rust-toolchain.toml, which works whatever rustup
        # version the image ships.
        run: |
          docker run --rm \
            -v "$PWD:/home/rust/src" -w /home/rust/src \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            messense/rust-musl-cross:x86_64-musl@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a \
            bash -c "rustup toolchain install \"\$(sed -n 's/^channel *= *\"\(.*\)\"/\1/p' rust-toolchain.toml)\" --profile minimal && rustup target add x86_64-unknown-linux-musl && cargo build -p miden-client-web --no-default-features --features nodejs,testing --release --locked --target x86_64-unknown-linux-musl"
          git diff --exit-code -- Cargo.lock

      - name: Prepare .node binary
        run: |
          BINARY=target/x86_64-unknown-linux-musl/release/libmiden_client_web.so
          if [ ! -f "$BINARY" ]; then
            echo "::error::musl napi binary not found at $BINARY"
            exit 1
          fi
          cp "$BINARY" packages/node-sdk-linux-x64-musl/miden_client_web.node

      - name: Verify musl binary loads on Alpine
        # A cross-compiled musl cdylib can link "successfully" yet fail to
        # dlopen on a real musl runtime. Load the built addon inside
        # node:alpine before publishing: if it can't load, this job fails and
        # so does the release, instead of shipping a broken binary that
        # reintroduces "module not found" on Alpine.
        run: |
          docker run --rm \
            -v "$PWD/packages/node-sdk-linux-x64-musl:/pkg:ro" \
            node:20-alpine \
            node -e "require('/pkg/miden_client_web.node'); console.log('musl .node loaded on Alpine OK')"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-sdk-linux-x64-musl
          path: packages/node-sdk-linux-x64-musl/miden_client_web.node

  build-release-packages:
    needs: check-version
    if: >
      needs.check-version.outputs.should_publish_web == 'true' ||
      needs.check-version.outputs.should_publish_react == 'true' ||
      needs.check-version.outputs.adopted_count != '0'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.check-version.outputs.checkout_ref }}

      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up Rust toolchains and wasm target
        if: >
          needs.check-version.outputs.should_publish_web == 'true' ||
          needs.check-version.outputs.should_publish_react == 'true'
        # ST uses stable; MT needs the pinned nightly and build-std components.
        run: |
          rustup update --no-self-update
          rustup target add wasm32-unknown-unknown
          rustup install stable --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Install binaryen (wasm-opt)
        if: >
          needs.check-version.outputs.should_publish_web == 'true' ||
          needs.check-version.outputs.should_publish_react == 'true'
        # The digest-verified native optimizer produces the published bytes.
        run: ./scripts/install-binaryen.sh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web-client
        if: >
          needs.check-version.outputs.should_publish_web == 'true' ||
          needs.check-version.outputs.should_publish_react == 'true'
        run: |
          pnpm --filter @miden-sdk/miden-sdk run build
          git diff --exit-code -- Cargo.lock

      - name: Verify WASM is optimized
        if: >
          needs.check-version.outputs.should_publish_web == 'true' ||
          needs.check-version.outputs.should_publish_react == 'true'
        run: ./scripts/verify-wasm-size.sh

      - name: Ensure web-client dist exists (hydrate from npm)
        # Adopted-only retries still need core types. On next, an unchanged
        # package version need not exist on npm; reject hydration's fallback
        # rather than compile against a different SDK. Never hydrate over a
        # source build whose bytes will be published by this run.
        if: >
          needs.check-version.outputs.adopted_count != '0' &&
          needs.check-version.outputs.should_publish_web != 'true' &&
          needs.check-version.outputs.should_publish_react != 'true'
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' crates/web-client/package.json)
          PUBLISHED=$(npm view "@miden-sdk/miden-sdk@${VERSION}" version 2>/dev/null || echo "")
          if [ "$VERSION" != "$PUBLISHED" ]; then
            echo "::error title=Cannot hydrate web-client::@miden-sdk/miden-sdk@${VERSION} is not on npm and is not being built in this run; refusing to compile the adopted packages against a different client version."
            exit 1
          fi
          pnpm run hydrate:web-client

      - name: Build react-sdk
        # Adopted packages resolve workspace React types even when React is
        # already published, so their retries also need its source-built dist.
        if: >
          needs.check-version.outputs.should_publish_react == 'true' ||
          needs.check-version.outputs.adopted_count != '0'
        run: pnpm --filter @miden-sdk/react run build

      - name: Archive release packages
        # Preserve complete trees, including worker assets and declarations.
        run: |
          paths=(crates/web-client/dist)
          if [ "${{ needs.check-version.outputs.should_publish_react }}" = "true" ] ||
             [ "${{ needs.check-version.outputs.adopted_count }}" != "0" ]; then
            paths+=(packages/react-sdk/dist)
          fi
          tar -czf release-packages.tar.gz "${paths[@]}"
          sha256sum release-packages.tar.gz > release-packages.sha256

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ needs.check-version.outputs.checkout_ref }}
          path: |
            release-packages.tar.gz
            release-packages.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [check-version, build-native-nodejs, build-native-nodejs-musl, build-release-packages]
    if: >
      !cancelled() &&
      needs.check-version.result == 'success' &&
      (
        needs.build-release-packages.result == 'success' ||
        (
          needs.check-version.outputs.should_publish_web != 'true' &&
          needs.check-version.outputs.should_publish_react != 'true' &&
          needs.check-version.outputs.adopted_count == '0'
        )
      ) &&
      (
        needs.check-version.outputs.should_publish_web != 'true' ||
        (
          needs.build-native-nodejs.result == 'success' &&
          needs.build-native-nodejs-musl.result == 'success'
        )
      ) &&
      (
        needs.check-version.outputs.should_publish_web == 'true' ||
        needs.check-version.outputs.should_publish_react == 'true' ||
        needs.check-version.outputs.should_publish_vite == 'true' ||
        needs.check-version.outputs.adopted_count != '0'
      )
    # npm provenance requires a GitHub-hosted runner for the OIDC attestation.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.check-version.outputs.checkout_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Ensure npm CLI supports trusted publishing
        # Trusted publishing (OIDC) needs npm CLI ≥ 11.5. node-version: '24'
        # ships npm 11.x as of 2026-Q2, but a force-update keeps the workflow
        # robust to runner image drift. Pinned to the 11.x major: a future
        # npm 12 could land breaking changes to --provenance / OIDC and this
        # workflow would silently break with a floating @latest.
        run: npm install -g 'npm@^11.5'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # No run-id or repository override: artifacts belong to this workflow run.
      # The name and every producer checkout are bound to the resolved source SHA.
      - name: Download release packages
        if: >
          needs.check-version.outputs.should_publish_web == 'true' ||
          needs.check-version.outputs.should_publish_react == 'true' ||
          needs.check-version.outputs.adopted_count != '0'
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.check-version.outputs.checkout_ref }}
          path: release-artifacts

      - name: Verify and extract release packages
        if: >
          needs.check-version.outputs.should_publish_web == 'true' ||
          needs.check-version.outputs.should_publish_react == 'true' ||
          needs.check-version.outputs.adopted_count != '0'
        run: |
          cd release-artifacts
          sha256sum --check release-packages.sha256
          tar -xzf release-packages.tar.gz -C ..
          cd ..
          test -s crates/web-client/dist/st/index.d.ts
          if [ "${{ needs.check-version.outputs.should_publish_react }}" = "true" ] ||
             [ "${{ needs.check-version.outputs.adopted_count }}" != "0" ]; then
            test -s packages/react-sdk/dist/index.d.ts
          fi

      # ── Node.js platform packages ─────────────────────────────────────
      # Tied to the web-client publish; ship only when web-client itself
      # ships, so the optionalDependencies versions on web-client's
      # package.json always match a real published platform-binary version.

      - name: Download native binary artifacts
        if: needs.check-version.outputs.should_publish_web == 'true' && needs.build-native-nodejs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: node-sdk-*
          path: artifacts

      - name: Sync platform package versions and publish
        if: needs.check-version.outputs.should_publish_web == 'true' && needs.build-native-nodejs.result == 'success'
        # musl goes first: until @miden-sdk/node-linux-x64-musl has its one-time
        # npm setup (AGENTS.md, Releases section) its publish fails, and going
        # first means it fails before any other package is published. A version
        # already on npm is skipped, so a re-run of a partially published
        # release finishes the rest.
        run: |
          WEB_VERSION=$(jq -r '.version' crates/web-client/package.json)
          DIST_TAG="${{ needs.check-version.outputs.dist_tag }}"
          for pkg in node-sdk-linux-x64-musl node-sdk-darwin-arm64 node-sdk-darwin-x64 node-sdk-linux-x64-gnu; do
            name=$(jq -r .name "packages/${pkg}/package.json")
            if [ "$(npm view "${name}@${WEB_VERSION}" version 2>/dev/null)" = "$WEB_VERSION" ]; then
              echo "${name}@${WEB_VERSION} is already on npm; skipping."
              continue
            fi
            cp "artifacts/${pkg}/miden_client_web.node" "packages/${pkg}/miden_client_web.node"
            jq --arg v "$WEB_VERSION" '.version = $v' "packages/${pkg}/package.json" > /tmp/pkg.json
            mv /tmp/pkg.json "packages/${pkg}/package.json"
            echo "Publishing ${name}@${WEB_VERSION} (--tag ${DIST_TAG}) ..."
            cd "packages/${pkg}"
            npm publish --tag "$DIST_TAG" --access public --provenance
            cd ../..
          done

      - name: Inject Node.js optionalDependencies before web-client publish
        if: needs.check-version.outputs.should_publish_web == 'true' && needs.build-native-nodejs.result == 'success'
        run: |
          cd crates/web-client
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            const v = pkg.version;
            pkg.optionalDependencies = {
              '@miden-sdk/node-darwin-arm64': v,
              '@miden-sdk/node-darwin-x64': v,
              '@miden-sdk/node-linux-x64-gnu': v,
              '@miden-sdk/node-linux-x64-musl': v,
            };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Injected optionalDependencies with version ' + v);
          "

      - name: Publish web-client to npm
        if: needs.check-version.outputs.should_publish_web == 'true'
        # `pnpm publish` automatically replaces `workspace:*` specifiers
        # with the resolved version from the workspace package.json
        # before publishing, so the published artifact is consumable
        # outside the monorepo.
        run: pnpm --filter @miden-sdk/miden-sdk publish --tag "${{ needs.check-version.outputs.dist_tag }}" --access public --provenance --no-git-checks

      - name: Publish react-sdk to npm
        if: needs.check-version.outputs.should_publish_react == 'true'
        run: pnpm --filter @miden-sdk/react publish --tag "${{ needs.check-version.outputs.dist_tag }}" --access public --provenance --no-git-checks

      # ── Vite plugin (release event only) ──────────────────────────────

      - name: Build vite-plugin
        if: needs.check-version.outputs.should_publish_vite == 'true'
        run: pnpm --filter @miden-sdk/vite-plugin run build

      - name: Publish vite-plugin to npm
        if: needs.check-version.outputs.should_publish_vite == 'true'
        run: pnpm --filter @miden-sdk/vite-plugin publish --tag "${{ needs.check-version.outputs.dist_tag }}" --access public --provenance --no-git-checks

      - name: Publish adopted packages
        if: needs.check-version.outputs.adopted_count != '0'
        run: |
          ./scripts/publish-plan.sh publish \
            '${{ needs.check-version.outputs.adopted_plan }}' \
            "${{ needs.check-version.outputs.dist_tag }}"

      # ── Reporting ─────────────────────────────────────────────────────

      - name: Done (web-client)
        if: needs.check-version.outputs.should_publish_web == 'true'
        env:
          CURRENT_VERSION: ${{ needs.check-version.outputs.web_version }}
          DIST_TAG: ${{ needs.check-version.outputs.dist_tag }}
        run: echo "✅ Web-client published $CURRENT_VERSION (--tag $DIST_TAG, with Node.js platform binaries)."

      - name: Done (react-sdk)
        if: needs.check-version.outputs.should_publish_react == 'true'
        env:
          CURRENT_VERSION: ${{ needs.check-version.outputs.react_version }}
          DIST_TAG: ${{ needs.check-version.outputs.dist_tag }}
        run: echo "✅ React SDK published $CURRENT_VERSION (--tag $DIST_TAG)."

      - name: Done (vite-plugin)
        if: needs.check-version.outputs.should_publish_vite == 'true'
        env:
          CURRENT_VERSION: ${{ needs.check-version.outputs.vite_version }}
          DIST_TAG: ${{ needs.check-version.outputs.dist_tag }}
        run: echo "✅ Vite plugin published $CURRENT_VERSION (--tag $DIST_TAG)."

  skipped:
    needs: check-version
    # Only run when check-version actually evaluated. If its top-level
    # `if:` rejected the event (e.g. PR merged to next without the
    # `patch release` label), all `should_publish_*` outputs are empty
    # strings, the `!= 'true'` checks below would all evaluate true,
    # and this job would print a misleading "all gates failed" message.
    # The `result == 'success'` guard prevents that.
    if: >
      needs.check-version.result == 'success' &&
      needs.check-version.outputs.should_publish_web != 'true' &&
      needs.check-version.outputs.should_publish_react != 'true' &&
      needs.check-version.outputs.should_publish_vite != 'true' &&
      needs.check-version.outputs.adopted_count == '0'
    runs-on: ubuntu-24.04
    steps:
      - name: Skipped publish (all packages)
