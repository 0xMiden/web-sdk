name: Web SDK native request assertion proof

on:
  push:
    branches: [ci/fresh-web-native-request-red]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify one assertion failure from the frozen source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2c52cac33ef4651f3347a70bbb514daa6dde34cb
          set +e
          pnpm -C crates/idxdb-store/src exec vitest run ts/storage-continuity.test.ts --maxWorkers=2 --reporter=json --outputFile="$RUNNER_TEMP/native-request.json"
          result=$?
          set -e
          test "$result" = 1
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/native-request.json', 'utf8'));
          const assertions = result.testResults.flatMap(suite => suite.assertionResults);
          const failures = assertions.filter(test => test.status === 'failed');
          assert.equal(assertions.length, 6);
          assert.equal(assertions.filter(test => test.status === 'passed').length, 5);
          assert.equal(failures.length, 1);
          assert.match(failures[0].fullName, /reports native request errors that Dexie handles at the request$/);
          assert.match(failures[0].failureMessages[0], /expected "spy" to be called once/);
          console.log(failures[0].fullName, failures[0].failureMessages[0]);
          NODE
