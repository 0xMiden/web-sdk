name: Linked client PR ready

# Mergeability gate for PRs that carry a `Client PR: #N` marker.
#
# The auto-patch action (.github/actions/inject-linked-client-pr) makes
# the PR's CI build green against the linked PR's head, so the diff stays
# clean. But the *published* artifact, after merge, builds from whatever
# `miden-client` version the root Cargo.toml pins — a crates.io release, on
# `main` and on `next` alike. So after merge the base branch is red until
# that pinned version exists on crates.io AND contains the linked commit.
#
# This workflow publishes a Check Run named `linked-client-pr-ready` on the
# PR that concludes `success` only once both are true. Until then the run
# stays `in_progress` (not success) — a ruleset's required status check can
# require it by name, blocking merge.
#
# The pin is read from the PR's HEAD, not the base branch: a PR that needs a
# new client API has to bump the pin itself, and it is that new pin the base
# branch builds against once merged.
#
# `next` used to be gated on "linked PR merged into rust-sdk/next" instead,
# on the premise that `next` consumed miden-client as a git source. It does
# not — it pins a released version exactly as `main` does — so that rule let
# a PR merge against an API that no published version had yet, which is how
# web-sdk#302 landed on a red `next` (rust-sdk#2421 was on rust-sdk/next but
# in no release; `next` pinned 0.16.0-rc.1, which predated it).
#
# Note for anyone tempted to reach for `releases/latest` here: that endpoint
# skips prereleases, so on a repo mid-`X.Y.0-rc.N` it reports the last stable
# (0.15.5 while 0.16.0-rc.2 is current) and a gate built on it could never go
# green for the rc line. Resolving the pinned version's own tag sidesteps it.
#
# Why a Check Run rather than a commit status: GitHub caps each
# (commit SHA, status context) pair at 1000 statuses. This workflow
# re-evaluates every 15 min via cron, so a long-lived PR whose head SHA
# stays put would steadily burn that cap; once exhausted, every further
# `POST /statuses` 422s and the verdict can never change again — e.g. a
# pending→success flip when upstream finally releases is silently dropped
# and the PR stays blocked on a stale `pending`. Check Runs have no such
# per-SHA cap: a single run is created per head SHA and updated in place on
# every later evaluation, so the verdict always reflects current state.

on:
  # `pull_request_target` (not `pull_request`) so the gate works for PRs
  # from forks. GitHub gives the workflow's GITHUB_TOKEN read-only perms
  # on `pull_request` events from forks for security reasons, regardless
  # of what `permissions:` declares below. That makes the check-runs API
  # write (POST /repos/.../check-runs) 403, and the workflow fails on
  # any fork PR — including ones that have no Client PR marker and just
  # need the gate to publish `success`.
  #
  # `pull_request_target` runs in the base repo's context with the base
  # repo's permissions, so the token can write check runs. This is the
  # standard pattern for "I need to post a check result on a fork PR."
  #
  # SAFETY: `pull_request_target` is only safe when the workflow does NOT
  # execute PR-supplied code. This one doesn't — it only reads metadata
  # via `gh api` and publishes a check run. `actions/checkout@v6` defaults
  # to the base ref under `pull_request_target` (so the workflow file
  # itself is the merged main version, not whatever the PR author shipped),
  # and we don't run any of the PR's code or scripts.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Re-evaluate on a schedule so the check goes green when upstream catches
  # up, without requiring a push to this PR.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pull-requests: read
  # The gate publishes its verdict as a Check Run named `linked-client-pr-ready`
  # via the check-runs API (POST/PATCH /repos/.../check-runs), which requires
  # `checks: write`. Without this scope the API calls 403 and the verdict never
  # lands on the commit.
  checks: write

concurrency:
  group: linked-client-pr-ready @ ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scheduled-fanout:
    # The schedule trigger fires once per repo; we need to fan out across
    # every open PR that carries a Client PR marker so each gets its check
    # re-evaluated. On `pull_request_target` events we skip this and run
    # `gate` directly with the event's PR.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --state open --search 'in:body "Client PR:"' \
            --json number --jq 'map(.number)')
          echo "prs=${prs:-[]}" >> "$GITHUB_OUTPUT"

  gate:
    needs: [scheduled-fanout]
    if: |
      always() &&
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'schedule' && needs.scheduled-fanout.outputs.prs != '[]'))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ github.event_name == 'schedule' && fromJSON(needs.scheduled-fanout.outputs.prs) || fromJSON(format('[{0}]', github.event.pull_request.number)) }}
    steps:
      - uses: actions/checkout@v6

      - name: Evaluate linked-client-pr readiness for PR #${{ matrix.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ matrix.pr }}
        run: |
          set -euo pipefail

          # Extract body and metadata separately. body is multi-line
          # arbitrary text, so it can't be packed into a `read`-friendly
          # tab-separated row alongside other fields — `read -r` only
          # consumes through the first newline. base_ref and state are
          # both single-token, so they pack fine.
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM" --jq '.body // ""')
          IFS=$'\t' read -r base_ref state <<<"$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM" \
            --jq '"\(.base.ref)\t\(.state)"')"

          # Skip closed PRs entirely.
          if [ "$state" != "open" ] && [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUM is $state — skipping."
            exit 0
          fi

          head_sha=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUM --jq .head.sha)

          # Publish the readiness verdict as a Check Run named
          # `linked-client-pr-ready`. The verdict maps to:
          #   ready   → status=completed, conclusion=success  (passes; requirable)
          #   pending → status=in_progress                    (blocks if required;
          #                                                     flips to success on a
          #                                                     later run once upstream
          #                                                     catches up)
          # Check Runs have no per-SHA cap, so re-evaluating every 15 min can
          # always record the current verdict. We reuse the run already on this
          # head SHA (updating it in place) instead of creating a new one each
          # tick. Any API failure is fatal (set -euo pipefail) — a verdict the
          # gate cannot record must surface as a red job, never a silent pass.
          set_check() {
            local verdict="$1" summary="$2"
            local name="linked-client-pr-ready"
            local status conclusion=""
            if [ "$verdict" = "success" ]; then
              status="completed"
              conclusion="success"
            else
              status="in_progress"
            fi
            local details_url=""
            if [ -n "${repo:-}" ] && [ -n "${num:-}" ]; then
              details_url="https://github.com/${repo}/pull/${num}"
            fi

            local existing_id
            existing_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?check_name=$name" \
              --jq '(.check_runs | sort_by(.started_at) | last | .id) // empty' \
              2>/dev/null || true)

            if [ -n "$existing_id" ]; then
              jq -n \
                --arg status "$status" --arg conclusion "$conclusion" \
                --arg title "$name" --arg summary "$summary" --arg details "$details_url" \
                '{status: $status, output: {title: $title, summary: $summary}}
                 + (if $conclusion != "" then {conclusion: $conclusion} else {} end)
                 + (if $details != "" then {details_url: $details} else {} end)' \
              | gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$existing_id" --input - >/dev/null
            else
              jq -n \
                --arg name "$name" --arg head "$head_sha" \
                --arg status "$status" --arg conclusion "$conclusion" \
                --arg title "$name" --arg summary "$summary" --arg details "$details_url" \
                '{name: $name, head_sha: $head, status: $status, output: {title: $title, summary: $summary}}
                 + (if $conclusion != "" then {conclusion: $conclusion} else {} end)
                 + (if $details != "" then {details_url: $details} else {} end)' \
              | gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
            fi
          }

          # Parse marker; absent → check passes (no gate needed).
          marker=$(printf '%s' "$body" | grep -ioE '^[[:space:]]*Client PR:[[:space:]]*([0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+)?#[0-9]+' | head -1 || true)
          if [ -z "$marker" ]; then
            echo "No Client PR marker on PR #$PR_NUM — check passes."
            set_check success "No linked client PR — nothing to gate."
            exit 0
          fi

          repo=$(printf '%s' "$marker" | grep -oE '[0-9a-zA-Z._-]+/[0-9a-zA-Z._-]+' | head -1 || echo "0xMiden/rust-sdk")
          num=$(printf '%s' "$marker" | grep -oE '[0-9]+$')

          # Pull the upstream PR's state. Tab-separated, IFS=$'\t' for
          # consistency even though neither field can contain whitespace.
          IFS=$'\t' read -r merged merge_commit_sha <<<"$(gh api "repos/$repo/pulls/$num" --jq '"\(.merged)\t\(.merge_commit_sha // "")"')"

          # Step 1: linked PR must be merged.
          if [ "$merged" != "true" ]; then
            set_check pending "Linked ${repo}#${num} not merged yet."
            echo "::notice::Gate PENDING — ${repo}#${num} not merged yet."
            exit 0
          fi

          if [ -z "$merge_commit_sha" ]; then
            set_check pending "Linked ${repo}#${num} merged but merge_commit_sha unknown."
            exit 0
          fi

          # Step 2: the version this PR leaves pinned must be released, and must
          # contain the linked commit. Same requirement whichever branch is
          # targeted — see the header: `main` and `next` both pin a crates.io
          # release, so both are red after merge until one exists.
          #
          # Read the pin from the PR head. `miden-client-sqlite-store` is pinned
          # on its own line and must not match, hence the anchored name.
          pinned=$(gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$head_sha" --jq '.content' \
            | base64 -d \
            | sed -n 's/^miden-client[[:space:]]*=.*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            | head -1)
          # Tolerate a caret/tilde/equals requirement, but only an exact version
          # maps to a tag; anything looser is reported rather than guessed at.
          pinned=${pinned#[\^~=]}
          if [ -z "$pinned" ]; then
            set_check pending "Could not read the miden-client pin from Cargo.toml at ${head_sha}."
            exit 0
          fi
          if ! printf '%s' "$pinned" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            set_check pending "miden-client is pinned to '${pinned}', which is not an exact version this gate can resolve to a tag."
            exit 0
          fi

          # Published? crates.io is the authority here, not the git tag: the tag
          # is created first and `cargo publish` runs after it, so a tag alone
          # does not mean the build can resolve the version.
          # crates.io rejects requests without a descriptive User-Agent with a
          # 403. Omitting it would make this branch permanently "not published"
          # — the gate would never go green for anyone.
          if ! curl -fsS --max-time 30 -o /dev/null \
                 -H "User-Agent: 0xMiden-web-sdk-linked-client-pr-gate (github.com/$GITHUB_REPOSITORY)" \
                 "https://crates.io/api/v1/crates/miden-client/${pinned}"; then
            set_check pending "miden-client ${pinned} is pinned but not published on crates.io yet."
            echo "::notice::Gate PENDING — miden-client ${pinned} not on crates.io."
            exit 0
          fi

          # Does that release contain the linked commit? Compare against the tag
          # by NAME so an annotated tag resolves to its commit; comparing against
          # the ref's object SHA would hand the API a tag object.
          tag="v${pinned}"
          status_field=$(gh api "repos/$repo/compare/${merge_commit_sha}...${tag}" --jq .status 2>/dev/null || echo "")
          case "$status_field" in
            ahead|identical)
              set_check success "Linked ${repo}#${num} is in miden-client ${pinned}, the version this PR pins."
              ;;
            "")
              set_check pending "miden-client ${pinned} is published but ${repo} has no tag ${tag} to verify it against."
              ;;
            *)
              set_check pending "Linked ${repo}#${num} merged, but is not in miden-client ${pinned} — the version this PR pins. It needs a release containing it, and the pin moved to that release."
              ;;
          esac
