# Config file for typos. For more information, see: https://github.com/crate-ci/typos
[files]
extend-exclude = ["*.d.ts", "*.json", "*.lock", "*.map", "crates/idxdb-store/src/js", "dist"]

[default.extend-words]
# React's media event is spelled `onSeeked`; it appears in typedoc output
# generated from @types/react, so it cannot be spelled "correctly".
Seeked = "Seeked"

